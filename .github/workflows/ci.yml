name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  app:
    name: Flutter（analyze + test + 构建 Windows）
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # flutter_tts 的 Windows 实现要下载 CppWinRT，CMake 会调用 nuget.exe
      - name: 准备 nuget
        shell: pwsh
        run: |
          if (-not (Get-Command nuget -ErrorAction SilentlyContinue)) {
            choco install nuget.commandline -y --no-progress
          }

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

  petforge:
    name: PetForge（CLI 冒烟）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/petforge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m petforge.cli tests/sample_photo.jpg -o "$RUNNER_TEMP/petpack-out" --animate
